# Prometheus: собирает метрики со ВСЕХ копий API (DNS-имя api в Docker
# возвращает адрес каждой копии), с базы, Redis и PgBouncer.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8080
    metrics_path: /metrics
  - job_name: postgres
    static_configs: [{ targets: ['postgres-exporter:9187'] }]
  - job_name: redis
    static_configs: [{ targets: ['redis-exporter:9121'] }]
